<!DOCTYPE html>
<html>

<head>
    <title>Animations</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #b8d9e6 0%, #d1dfc4 58%, #a9c18f 100%);
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // ===== แสง =====
        // 1) แสงแวดล้อมไล่สี ฟ้า -> พื้น
        const hemisphereLight = new THREE.HemisphereLight(0xdcecff, 0xb3a38b, 0.6);
        scene.add(hemisphereLight);

        // 2) แสงหลัก (แดดอุ่น) + เงานุ่มคมขึ้น ครอบคลุมทั้งฉาก
        const directionalLight = new THREE.DirectionalLight(0xfff0d6, 1.1);
        directionalLight.position.set(-18, 20, -16);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.set(2048, 2048);
        const sc = directionalLight.shadow.camera;
        sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30;
        sc.near = 1; sc.far = 80;
        directionalLight.shadow.bias = -0.0005;
        directionalLight.shadow.normalBias = 0.05;
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        // 3) แสงเสริม (fill) จากด้านตรงข้าม ไม่ให้ฝั่งเงามืดสนิท
        const fillLight = new THREE.DirectionalLight(0xbcd8ff, 0.35);
        fillLight.position.set(16, 8, 12);
        scene.add(fillLight);

        // 4) แสงขอบ (rim) จากด้านหลัง ช่วยให้ขอบรถเด่นออกจากฉาก
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
        rimLight.position.set(12, 12, 0);
        scene.add(rimLight);

        // 5) ไฟอุ่นในห้อง (ตำแหน่งตั้งตอนโหลดโมเดล)
        const interiorLight = new THREE.PointLight(0xffc27a, 1.4, 18, 2);
        scene.add(interiorLight);

        // 6) แสงสลัวในห้องคนขับ (2 ช่องหน้าต่างใต้จอ)
        const CAB = { x: -10.9, y: 6, zL: -2, zR: 3.5, intensity: 1.9 };
        const cabLights = [0xffb066, 0xffb066].map((c) => {
            const l = new THREE.PointLight(c, CAB.intensity, 7, 2);
            scene.add(l);
            return l;
        });
        function layoutCabLights() {
            cabLights[0].position.set(CAB.x, CAB.y, CAB.zL);
            cabLights[1].position.set(CAB.x, CAB.y, CAB.zR);
            cabLights.forEach((l) => (l.intensity = CAB.intensity));
        }
        layoutCabLights();
        // 1/2 = มืด/สว่าง | 3/4 = เข้า/ออก | 5/6 = ต่ำ/สูง | 0 = พิมพ์ค่า
        window.addEventListener('keydown', (e) => {
            const k = e.code;
            if (k === 'Digit1') CAB.intensity = Math.max(0, CAB.intensity - 0.1);
            else if (k === 'Digit2') CAB.intensity += 0.1;
            else if (k === 'Digit3') CAB.x += 0.2;
            else if (k === 'Digit4') CAB.x -= 0.2;
            else if (k === 'Digit5') CAB.y -= 0.2;
            else if (k === 'Digit6') CAB.y += 0.2;
            else if (k === 'Digit0') return console.log(JSON.stringify(CAB));
            else return;
            layoutCabLights();
        });
        //load glb และใช้ pbr material
        const clock = new THREE.Clock();
        let mixer;
        const loader = new THREE.GLTFLoader();
        loader.load('https://panztewsz.github.io/Comgraph/Van10_10_meKey.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 1);
            model.scale.set(3, 3, 3);
            scene.add(model);
            vanModel = model;

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
            } else {
                console.warn('Van10_10.glb has no animation clips to play.');
            }

            const bounds = new THREE.Box3().setFromObject(model);
            const center = bounds.getCenter(new THREE.Vector3());
            directionalLight.target.position.copy(center);
            interiorLight.position.set(center.x + 3, center.y + 1.5, center.z);
            addScreens();
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
            const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
            const distance = sphere.radius / Math.sin(limitingHalfFov) * 1.15;
            const viewDirection = new THREE.Vector3(0, 0.18, 1).normalize();

            controls.target.copy(center);
            camera.position.copy(center).addScaledVector(viewDirection, distance);
            camera.lookAt(center);
            controls.update();

        });

        const BASE = 'https://panztewsz.github.io/Comgraph/'; // โฟลเดอร์เดียวกับไฟล์ .glb
        const VIDEO_SRC = ['Blender.mp4', 'Paint.mp4', 'Smile.mp4'].map((f) => BASE + f); // ซ้าย, กลาง, ขวา
        const videos = [];

        // ===== ค่าจอ (หน่วยโลก 3D) — ค่าที่จูนแล้ว (ยังกดคีย์บอร์ดปรับต่อได้) =====
        const P = { x: -11.467691254615817, y: 8.746266346108053, z: 0.7250001502037076, totalW: 9.811800019741058, h: 2.5984509812021783, gap: 0.03, frame: 0.02 };
        const COL_FRAME = 0x1b4d43;
        const COL_SCREEN = 0x0f2f2a;
        const screenGroups = [];

        // ครอบวิดีโอให้เต็มจอโดยไม่ยืดภาพ (ตัดส่วนเกินด้านข้างหรือบนล่าง)
        function updateCover(g) {
            const { v, tex } = g.userData;
            if (!tex || !v.videoWidth) return;
            const w = (P.totalW - 2 * P.gap) / 3;
            const screenAspect = w / P.h;
            const videoAspect = v.videoWidth / v.videoHeight;
            if (videoAspect > screenAspect) tex.repeat.set(screenAspect / videoAspect, 1);
            else tex.repeat.set(1, videoAspect / screenAspect);
            tex.offset.set((1 - tex.repeat.x) / 2, (1 - tex.repeat.y) / 2);
        }

        function layoutScreens() {
            const w = (P.totalW - 2 * P.gap) / 3;
            screenGroups.forEach((g, i) => {
                g.position.set(P.x, P.y, P.z - P.totalW / 2 + w / 2 + i * (w + P.gap));
                g.children[0].geometry.dispose();
                g.children[0].geometry = new THREE.BoxGeometry(w + P.frame * 2, P.h + P.frame * 2, P.frame);
                g.children[1].geometry.dispose();
                g.children[1].geometry = new THREE.PlaneGeometry(w, P.h);
                updateCover(g);
            });
        }

        function addScreens() {
            for (let i = 0; i < 3; i++) {
                const group = new THREE.Group();
                group.rotation.y = -Math.PI / 2; // หันออกทาง -x (ถ้าไปผิดฝั่งเปลี่ยนเป็น +Math.PI/2 และใช้ max.x)

                const frame = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1, 1),
                    new THREE.MeshStandardMaterial({ color: COL_FRAME, roughness: 0.8 })
                );
                frame.position.z = -P.frame / 2 - 0.001;

                const v = document.createElement('video');
                v.src = VIDEO_SRC[i];
                v.loop = true; v.muted = true; v.playsInline = true;
                v.crossOrigin = 'anonymous';
                videos.push(v);

                const mat = new THREE.MeshBasicMaterial({ color: COL_SCREEN, toneMapped: false });
                v.addEventListener('playing', () => {
                    const tex = new THREE.VideoTexture(v);
                    mat.map = tex;
                    mat.color.set(0xffffff);
                    mat.needsUpdate = true;
                    group.userData.tex = tex;
                    updateCover(group);
                }, { once: true });
                v.addEventListener('error', () => console.error('โหลดวิดีโอไม่ได้:', VIDEO_SRC[i]));
                group.userData.v = v;
                v.play().catch(() => { });

                group.add(frame, new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat));
                scene.add(group);
                screenGroups.push(group);
                pickables.push(frame, group.children[1]);
            }
            layoutScreens();
        }

        window.addEventListener('click', () => videos.forEach(v => v.play()), { once: true });

        // ===== แสงตามมุมกล้อง =====
        // L = ล็อกแสงมาจากมุมที่กล้องมองอยู่ตอนนี้ | K = เปิด/ปิดโหมดแสงตามกล้องตลอด
        let followLight = false;
        function aimLightFromCamera() {
            const dir = camera.position.clone().sub(controls.target).normalize();
            directionalLight.position.copy(controls.target).addScaledVector(dir, 28);
            directionalLight.position.y += 12; // ยกให้สูงขึ้น เงาตกลงพื้นสวย
            directionalLight.target.position.copy(controls.target);
        }
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyL') aimLightFromCamera();
            else if (e.code === 'KeyK') followLight = !followLight;
        });

        // ===== คลิกจอ -> ซูมเข้า | คลิกที่ว่าง / Esc -> ซูมออก =====
        const pickables = [];
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let zoom = null;      // { pos, target } เป้าหมายที่กล้องกำลังเคลื่อนไปหา
        let home = null;      // มุมกล้องก่อนซูม

        function zoomToScreen(group) {
            if (!home) home = { pos: camera.position.clone(), target: controls.target.clone() };
            const center = group.getWorldPosition(new THREE.Vector3());
            const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(group.getWorldQuaternion(new THREE.Quaternion()));
            const w = (P.totalW - 2 * P.gap) / 3;
            const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const dist = Math.max(P.h / (2 * t), w / (2 * t * camera.aspect)) * 1.25;
            zoom = { pos: center.clone().addScaledVector(normal, dist), target: center };
        }
        function zoomOut() {
            if (home) { zoom = home; home = null; }
        }

        // แยกคลิกออกจากการลากหมุนกล้อง
        let downX = 0, downY = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return; // ลาก ไม่ใช่คลิก
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const screenHit = raycaster.intersectObjects(pickables, false)[0];
            const modelHit = vanModel ? raycaster.intersectObject(vanModel, true)[0] : null;
            // ใครอยู่ใกล้กล้องกว่า คนนั้นชนะ
            if (screenHit && (!modelHit || screenHit.distance <= modelHit.distance)) {
                return zoomToScreen(screenHit.object.parent);
            }
            if (modelHit) {
                const chain = nameChain(modelHit.object);
                const is = (re) => re && chain.some((n) => re.test(n));
                if (is(ABOUT_RE)) return flyToLaptop();
                if (is(PROJECT_RE)) return flyToProjects();
                if (is(SOUL_RE)) return flyToSoul();
            }
            zoomOut();
        });
        window.addEventListener('keydown', (e) => { if (e.code === 'Escape') zoomOut(); });
        controls.addEventListener('start', () => { zoom = null; }); // ผู้ใช้จับกล้องเอง ให้หยุดเลื่อนอัตโนมัติ


        // ===== กด About Me -> กล้องไปที่คอม =====
        // ถ้าชื่อ mesh ไม่ตรง: เปิด Console ดูว่าคลิกแล้วขึ้นชื่ออะไร แล้วแก้ ABOUT_RE / LAPTOP_RE
        // มุมกล้องที่คอมเป๊ะๆ: หมุนไปมุมที่ชอบ กด C ก๊อปค่ามาใส่ LAPTOP_VIEW
        const ABOUT_RE = /^(Text002|Text004)$/; // Text002 = About Me, Text004 = Contact (ไปที่คอมเหมือนกัน)
        const LAPTOP_RE = /^300441887_/; // รูปคนบนจอคอม ใช้เป็นจุดอ้างอิงตำแหน่งคอม
        // ชื่อ mesh ของปุ่ม (คลิกปุ่มแล้วดูชื่อในกล่องดำมุมซ้ายล่าง) ใส่เป็น regex เช่น /^Text003$/
        const PROJECT_RE = /^Text008$/; // ปุ่ม MyProject -> ซูมเห็น 3 จอวิดีโอ
        const SOUL_RE = /^Text005$/;   // ปุ่ม Soul Lor  -> หน้าต่างห้องคนขับ
        const PROJECT_VIEW = null, SOUL_VIEW = null; // ใส่ { pos:[..], target:[..] } จากปุ่ม C ถ้าอยากได้มุมเป๊ะ
        const LAPTOP_VIEW = null; // เช่น { pos: [x, y, z], target: [x, y, z] }
        let vanModel = null;

        function nameChain(o) { const n = []; while (o) { if (o.name) n.push(o.name); o = o.parent; } return n; }
        function findByName(re) {
            let found = null;
            if (vanModel) vanModel.traverse((o) => { if (!found && re.test(o.name)) found = o; });
            return found;
        }
        function flyTo(pos, target) {
            if (!home) home = { pos: camera.position.clone(), target: controls.target.clone() };
            zoom = { pos, target };
        }

        function viewFromJson(v) { return flyTo(new THREE.Vector3(...v.pos), new THREE.Vector3(...v.target)); }
        function flyToProjects() {
            if (PROJECT_VIEW) return viewFromJson(PROJECT_VIEW);
            const g = screenGroups[1];
            if (!g) return;
            const center = g.getWorldPosition(new THREE.Vector3());
            const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(g.getWorldQuaternion(new THREE.Quaternion()));
            const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const dist = Math.max(P.h / (2 * t), P.totalW / (2 * t * camera.aspect)) * 1.2;
            flyTo(center.clone().addScaledVector(normal, dist), center);
        }
        function flyToSoul() {
            if (SOUL_VIEW) return viewFromJson(SOUL_VIEW);
            // หน้าต่าง 2 บานใต้จอ (อ้างอิงตำแหน่งไฟ CAB)
            const target = new THREE.Vector3(CAB.x - 0.5, CAB.y - 0.1, (CAB.zL + CAB.zR) / 2);
            const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const dist = (10 / (2 * t * camera.aspect)) * 1.1;
            flyTo(target.clone().add(new THREE.Vector3(-dist, 0.3, 0)), target);
        }

        function flyToLaptop() {
            if (LAPTOP_VIEW) {
                return flyTo(new THREE.Vector3(...LAPTOP_VIEW.pos), new THREE.Vector3(...LAPTOP_VIEW.target));
            }
            const obj = findByName(LAPTOP_RE);
            if (!obj) return console.warn('หาคอมไม่เจอ: ดูรายชื่อใน Console แล้วแก้ LAPTOP_RE หรือใส่ LAPTOP_VIEW');
            const box = new THREE.Box3().setFromObject(obj);
            const c = box.getCenter(new THREE.Vector3());
            const d = box.getSize(new THREE.Vector3()).length();
            const dir = new THREE.Vector3(0, 0.3, 1).normalize(); // มองจากฝั่งที่เปิดโล่ง (+z)
            flyTo(c.clone().addScaledVector(dir, d * 2.6), c);
        }
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyC') console.log(JSON.stringify({ pos: camera.position.toArray(), target: controls.target.toArray() }));
        });


        function updateZoom() {
            if (!zoom) return;
            camera.position.lerp(zoom.pos, 0.08);
            controls.target.lerp(zoom.target, 0.08);
            controls.update(); // ให้กล้องหันไปมองเป้าหมายตามตำแหน่งใหม่
            if (camera.position.distanceTo(zoom.pos) < 0.01) zoom = null;
        }

        function animate(t) {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            updateZoom();
            if (followLight) aimLightFromCamera();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);


    </script>
</body>

</html>
