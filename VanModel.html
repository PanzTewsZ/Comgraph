<!DOCTYPE html>
<html>

<head>
    <title>Animations</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #b8d9e6 0%, #d1dfc4 58%, #a9c18f 100%);
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const hemisphereLight = new THREE.HemisphereLight(0xdcecff, 0xb3a38b, 0.9);
        scene.add(hemisphereLight);


        const directionalLight = new THREE.DirectionalLight(0xfff3e2, 0.45);
        directionalLight.position.set(-5, 8, 6);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        //load glb และใช้ pbr material
        const clock = new THREE.Clock();
        let mixer;
        const loader = new THREE.GLTFLoader();
        loader.load('https://panztewsz.github.io/Comgraph/Van10_10.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            model.position.set(0, 0, 1);
            model.scale.set(3, 3, 3);
            scene.add(model);

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
            } else {
                console.warn('Van10_10.glb has no animation clips to play.');
            }

            const bounds = new THREE.Box3().setFromObject(model);
            const center = bounds.getCenter(new THREE.Vector3());
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
            const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
            const distance = sphere.radius / Math.sin(limitingHalfFov) * 1.15;
            const viewDirection = new THREE.Vector3(0, 0.18, 1).normalize();

            controls.target.copy(center);
            camera.position.copy(center).addScaledVector(viewDirection, distance);
            camera.lookAt(center);
            controls.update();

        });


        function animate(t) {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        window.addEventListener('keydown', (event) => {

        });

    </script>
</body>

</html>
